modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL = "${mod_issue_url}" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
updateJSONURL = "https://github.com/Gameking1happy-Development/GK1H-Recycling/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
displayURL = "${mod_source_url}" #optional (displayed in the mod UI)
logoFile = "${mod_id}.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
[[dependencies.${ mod_id }]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[dependencies.${ mod_id }.mc-publish]
ignore = true
[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[dependencies.${ mod_id }.mc-publish]
ignore = true
[[dependencies.${ mod_id }]]
modId = "gk1hcore"
type = "required"
versionRange = "[${gk1hcore_version},)"
ordering = "NONE"
side = "BOTH"
[dependencies.${ mod_id }.mc-publish]
ignore = false
modrinth = "vjOWyxXu"
curseforge = "1384685"
[[dependencies.${ mod_id }]]
modId = "fzzy_config"
type = "required"
versionRange = "[${fzzy_config_version},)"
ordering = "NONE"
side = "BOTH"
[dependencies.${ mod_id }.mc-publish]
ignore = false
modrinth = "hYykXjDp"
curseforge = "1005914"
[[dependencies.${ mod_id }]]
modId = "mr_copper_recycling"
type = "optional"
versionRange = "[${copper_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${ mod_id }]]
modId = "mr_diamond_recycling"
type = "optional"
versionRange = "[${diamond_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${ mod_id }]]
modId = "mr_better_goldrecycling"
type = "optional"
versionRange = "[${gold_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${ mod_id }]]
modId = "mr_better_ironrecycling"
type = "optional"
versionRange = "[${iron_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${ mod_id }]]
modId = "mr_leather_recycling"
type = "optional"
versionRange = "[${leather_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${ mod_id }]]
