type = "optional"
versionRange = "[${netherite_recycling_version},)"
ordering = "AFTER"
side = "BOTH"
[mc-publish]
dependencies=[
    "mr_copper_recycling@>=${copper_recycling_version}(recommended){modrinth:fuupShGh}#(ignore:curseforge)",
    "mr_diamond_recycling@>=${diamond_recycling_version}(recommended){modrinth:jw67t8zN}#(ignore:curseforge)",
    "mr_better_goldrecycling@>=${gold_recycling_version}(recommended){modrinth:1IZygUPY}#(ignore:curseforge)",
